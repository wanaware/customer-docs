            items:
              type: string
      responses:
        '200':
          description: Successfully retrieved structure tag function relationships
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StructureTagFunctionRelationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Create structure tag function relationships
      description: Create one or more structure tag function relationships
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/StructureTagFunctionRelationInput'
      responses:
        '201':
          description: Structure tag function relationships created successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: >-
                    #/components/schemas/StructureTagFunctionRelationMutationResponse
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /structure-tag-function-relationships/batch-delete:
    delete:
      summary: Delete structure tag function relationships
      description: >-
        Delete structure tag function relationships by providing structureTagID
        and functionID pairs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/StructureTagFunctionIdsInput'
      responses:
        '200':
          description: Structure tag function relationships deleted successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: >-
                    #/components/schemas/StructureTagFunctionRelationMutationResponse
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /interface-ip-address-function-relationships:
    get:
      summary: Get interface IP address function relationships
      description: Retrieve interface IP address function relationships with filtering
      parameters:
        - name: ids
          in: query
          description: Array of relationship IDs
          schema:
            type: array
            items:
              type: string
        - name: functionIPIDs
          in: query
          description: Array of function IP IDs
          schema:
            type: array
            items:
              type: string
        - name: functionInterfaceIDs
          in: query
          description: Array of function interface IDs
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: Successfully retrieved interface IP address function relationships
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IntIPAddrFunctionRelationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /function-cnames:
    get:
      summary: Get function CNAMEs
      description: Retrieve function CNAME by filter criteria
      parameters:
        - name: id
          in: query
          required: true
          description: Function CNAME ID
          schema:
            type: string
      responses:
        '200':
          description: Successfully retrieved function CNAME
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionCnameResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /analytics/elements-by-asset-density:
    get:
      summary: Get elements by asset density
      description: Retrieve elements ranked by asset density with optional filtering
      parameters:
        - name: structureID
          in: query
          description: >-
            Structure ID to limit results to Elements within a specific
            Structure
          schema:
            type: string
        - name: collectionID
          in: query
          description: >-
            Collection ID to limit results to Elements that belong to the given
            Collection
          schema:
            type: string
        - name: sort
          in: query
          description: Sorting preference for list order by number of linked asset count
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
      responses:
        '200':
          description: Successfully retrieved elements by asset density
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElementsByAssetDensityResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /analytics/top-environments:
    get:
      summary: Get top environments by asset count
      description: >-
        Retrieve top 5 environments by asset count with optional filtering and
        timeframe
      parameters:
        - name: structureID
          in: query
          description: Structure ID to filter assets that belong to the given Structure
          schema:
            type: string
        - name: collectionID
          in: query
          description: Collection ID to filter assets that belong to the given Collection
          schema:
            type: string
        - name: elementID
          in: query
          description: Element ID to filter assets that belong to the given Element
          schema:
            type: string
        - name: sort
          in: query
          description: Sorting order for ranking by asset count
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
        - name: timeframe
          in: query
          description: The period (in days) for which asset counts are calculated
          schema:
            type: integer
            default: 30
      responses:
        '200':
          description: Successfully retrieved top environments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopEnvironmentsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /analytics/unclassified-assets:
    post:
      summary: Get unclassified assets analytics
      description: Retrieve analytics for unclassified assets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnclassifiedAssetsInput'
      responses:
        '200':
          description: Successfully retrieved unclassified assets analytics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnclassifiedAssetsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
