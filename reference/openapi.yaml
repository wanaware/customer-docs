openapi: 3.0.3
info:
  title: Function Integrator API
  description: >-
    API for managing functions, structure tags, data tags, and their
    relationships
  version: 1.0.0
  contact:
    name: Wanaware Function Integrator
servers:
  - url: https://api.wanaware.com/v1
    description: Production server
  - url: https://staging-api.wanaware.com/v1
    description: Staging server
paths:
  /structure-tags:
    get:
      summary: Get structure tags
      description: Retrieve structure tags with optional filtering and selection options
      parameters:
        - name: ids
          in: query
          description: Array of structure tag IDs to filter by
          schema:
            type: array
            items:
              type: string
        - name: onlyRootTags
          in: query
          description: Return only root-level tags
          schema:
            type: boolean
            default: false
        - name: tree
          in: query
          description: Include tree structure
          schema:
            type: boolean
            default: false
        - name: childTree
          in: query
          description: Include child tree
          schema:
            type: boolean
            default: false
        - name: parentTree
          in: query
          description: Include parent tree
          schema:
            type: boolean
            default: false
        - name: functionRelationship
          in: query
          description: Include function relationships
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Successfully retrieved structure tags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StructureTagResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Create structure tags
      description: Create one or more structure tags
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/StructureTagInput'
      responses:
        '201':
          description: Structure tags created successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StructureTagResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /structure-tags/{id}:
    put:
      summary: Update structure tag
      description: Update a structure tag by ID
      parameters:
        - name: id
          in: path
          required: true
          description: Structure tag ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StructureTagInput'
      responses:
        '200':
          description: Structure tag updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructureTagResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /structure-tags/batch-delete:
    delete:
      summary: Delete structure tags
      description: Delete multiple structure tags by IDs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    type: string
              required:
                - ids
      responses:
        '200':
          description: Structure tags deleted successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StructureTagResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /structure-tags/by-function:
    get:
      summary: Get structure tags by function IDs
      description: Retrieve structure tags associated with specific function IDs
      parameters:
        - name: functionIDs
          in: query
          required: true
          description: Array of function IDs
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: Successfully retrieved structure tags by function IDs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StructureTagByFunctionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /function-subtypes:
    get:
      summary: Get function sub types
      description: Retrieve function sub types by ID
      parameters:
        - name: id
          in: query
          description: Function sub type ID
          schema:
            type: string
      responses:
        '200':
          description: Successfully retrieved function sub types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FunctionSubTypeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Create function sub type
      description: Create a new function sub type
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FunctionSubTypeInput'
      responses:
        '201':
          description: Function sub type created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionSubTypeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /function-subtypes/{id}:
    put:
      summary: Update function sub type
      description: Update a function sub type by ID
      parameters:
        - name: id
          in: path
          required: true
          description: Function sub type ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FunctionSubTypeInput'
      responses:
        '200':
          description: Function sub type updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionSubTypeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      summary: Delete function sub type
      description: Delete a function sub type by ID
      parameters:
        - name: id
          in: path
          required: true
          description: Function sub type ID
          schema:
            type: string
      responses:
        '200':
          description: Function sub type deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionSubTypeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /function-subtypes/counts:
    get:
      summary: Get function subtype counts
      description: Get function subtype counts for a specific function type
      parameters:
        - name: functionType
          in: query
          required: true
          description: Function type to filter by
          schema:
            $ref: '#/components/schemas/FunctionType'
        - name: siteId
          in: query
          description: Site ID to filter by
          schema:
            type: string
        - name: fromDate
          in: query
          description: Start date for filtering
          schema:
            type: string
            format: date-time
        - name: toDate
          in: query
          description: End date for filtering
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Successfully retrieved function subtype counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionSubTypeCountResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /functions:
    get:
      summary: Get functions
      description: Retrieve functions with comprehensive filtering and pagination
      parameters:
        - name: page
          in: query
          description: Page number for pagination
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          description: Number of items per page
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 10
        - name: functionType
          in: query
          description: Filter by function type
          schema:
            $ref: '#/components/schemas/FunctionType'
        - name: functionSubType
          in: query
          description: Filter by function sub types
          schema:
            type: array
            items:
              type: string
        - name: name
          in: query
          description: Filter by function name
          schema:
            type: string
        - name: source
          in: query
          description: Filter by source
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Source'
        - name: dataTagIDs
          in: query
          description: Filter by data tag IDs
          schema:
            type: array
            items:
              type: string
        - name: structureTagIDs
          in: query
          description: Filter by structure tag IDs
          schema:
            type: array
            items:
              type: string
        - name: includeAttributes
          in: query
          description: Include function attributes
          schema:
            type: boolean
            default: true
        - name: includeParents
          in: query
          description: Include parent functions
          schema:
            type: boolean
            default: true
        - name: includeDataTags
          in: query
          description: Include data tags
          schema:
            type: boolean
            default: true
        - name: includeStructureTags
          in: query
          description: Include structure tags
          schema:
            type: boolean
            default: true
        - name: includeFunctionInterfaces
          in: query
          description: Include function interfaces
          schema:
            type: boolean
            default: true
        - name: includeFunctionIPs
          in: query
          description: Include function IPs
          schema:
            type: boolean
            default: true
        - name: includeRelatives
          in: query
          description: Include function relatives
          schema:
            type: boolean
            default: true
        - name: sortField
          in: query
          description: Field to sort by
          schema:
            type: string
            enum:
              - NAME
              - CREATED_AT
              - UPDATED_AT
        - name: sortOrder
          in: query
          description: Sort order
          schema:
            type: string
            enum:
              - ASC
              - DESC
            default: ASC
      responses:
        '200':
          description: Successfully retrieved functions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedFunctionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Create functions
      description: Create one or more functions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/FunctionInput'
      responses:
        '201':
          description: Functions created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateFunctionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /functions/{id}:
    put:
      summary: Update function
      description: Update a function by ID
      parameters:
        - name: id
          in: path
          required: true
          description: Function ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FunctionInput'
      responses:
        '200':
          description: Function updated successfully
