      responses:
        '200':
          description: Functions deleted successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FunctionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /functions/by-external-id:
    put:
      summary: Update functions by external ID
      description: Update functions using their external IDs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/FunctionInput'
      responses:
        '200':
          description: Functions updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateFunctionByExternalIDResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /functions/by-external-id/{externalId}:
    delete:
      summary: Delete function by external ID
      description: Delete a function by its external ID
      parameters:
        - name: externalId
          in: path
          required: true
          description: Function external ID
          schema:
            type: string
      responses:
        '200':
          description: Function deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /function-attributes/{id}:
    get:
      summary: Get function attribute
      description: Retrieve function attribute by ID with optional filtering
      parameters:
        - name: id
          in: path
          required: true
          description: Function attribute ID
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum number of results
          schema:
            type: integer
            minimum: 1
            default: 100
        - name: offset
          in: query
          description: Offset for pagination
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: attributeType
          in: query
          description: Filter by attribute type
          schema:
            type: string
        - name: attributeSubType
          in: query
          description: Filter by attribute sub type
          schema:
            type: string
        - name: externalID
          in: query
          description: Filter by external ID
          schema:
            type: string
      responses:
        '200':
          description: Successfully retrieved function attribute
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionAttributeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      summary: Update function attribute
      description: Update a function attribute by ID
      parameters:
        - name: id
          in: path
          required: true
          description: Function attribute ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FunctionAttributeInput'
      responses:
        '200':
          description: Function attribute updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionAttributeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /function-attributes:
    post:
      summary: Create function attributes
      description: Create one or more function attributes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/FunctionAttributeInput'
      responses:
        '201':
          description: Function attributes created successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FunctionAttributeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /function-attribute-types:
    get:
      summary: Get function attribute types
      description: Retrieve function attribute types with optional ID filtering
      parameters:
        - name: ids
          in: query
          description: Array of function attribute type IDs
          schema:
            type: array
            items:
              type: integer
      responses:
        '200':
          description: Successfully retrieved function attribute types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FunctionAttributeTypeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Create function attribute types
      description: Create one or more function attribute types
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CreateFunctionAttributeTypeInput'
      responses:
        '201':
          description: Function attribute types created successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FunctionAttributeTypeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      summary: Update function attribute types
      description: Update multiple function attribute types
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/UpdateFunctionAttributeTypeInput'
      responses:
        '200':
          description: Function attribute types updated successfully
          content:
            application/json:
              schema:
