        '500':
          $ref: '#/components/responses/InternalServerError'
  /function-ip-blocks:
    get:
      summary: Get function IP blocks
      description: Retrieve function IP blocks with pagination
      parameters:
        - name: functionID
          in: query
          required: true
          description: Function ID to filter by
          schema:
            type: string
        - name: page
          in: query
          required: true
          description: Page number
          schema:
            type: integer
            minimum: 1
        - name: size
          in: query
          required: true
          description: Size of each page
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Successfully retrieved function IP blocks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedFunctionIPResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /data-tag-function-relationships:
