name: Documentation quality

on:
  pull_request:
  push:
    branches:
      - v1.0
      - 'v1.0_*'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
