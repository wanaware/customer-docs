<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="product-model-title product-model-description">
  <title id="product-model-title">How WanAware records fit together</title>
  <desc id="product-model-description">An Integration sends Assets through Discovery into Inventory. Assets can then be grouped into Collections inside an Element. Structure Tags attach Elements and Collections to a Structure hierarchy.</desc>

  <defs>
    <linearGradient id="canvas-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1018"/>
      <stop offset="1" stop-color="#090c12"/>
    </linearGradient>
    <linearGradient id="card-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#182640"/>
      <stop offset="1" stop-color="#121c31"/>
    </linearGradient>
    <linearGradient id="collection-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14233d"/>
      <stop offset="1" stop-color="#101a2e"/>
    </linearGradient>
    <linearGradient id="accent-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#20c8d8"/>
      <stop offset="1" stop-color="#65e5c3"/>
    </linearGradient>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000814" flood-opacity="0.38"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#496589"/>
    </marker>
    <marker id="accent-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#24cad5"/>
    </marker>
    <style>
      .label { fill: #8293ae; font: 600 14px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0.13em; }
      .title { fill: #f3f7ff; font: 700 32px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .card-title { fill: #f5f8ff; font: 700 27px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .collection-title { fill: #f5f8ff; font: 700 23px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .subtitle { fill: #a5b3ca; font: 400 18px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .body { fill: #dce5f5; font: 500 17px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { fill: #91a1ba; font: 500 15px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .accent { fill: #64e3de; font: 600 15px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
  </defs>

  <rect width="1600" height="1000" rx="28" fill="url(#canvas-gradient)"/>
  <rect x="1.5" y="1.5" width="1597" height="997" rx="26.5" fill="none" stroke="#202b3e" stroke-width="3"/>

  <text x="70" y="64" class="title">How WanAware records fit together</text>
  <text x="70" y="108" class="label">FROM SOURCE TO INVENTORY</text>

  <!-- Source flow -->
  <g filter="url(#card-shadow)">
    <rect x="70" y="136" width="390" height="132" rx="18" fill="url(#card-gradient)" stroke="#34496d" stroke-width="2.5"/>
    <rect x="604" y="136" width="350" height="132" rx="18" fill="url(#card-gradient)" stroke="#34496d" stroke-width="2.5"/>
    <rect x="1098" y="136" width="432" height="132" rx="18" fill="url(#card-gradient)" stroke="#34496d" stroke-width="2.5"/>
  </g>

  <rect x="94" y="160" width="7" height="84" rx="3.5" fill="url(#accent-gradient)"/>
  <text x="125" y="190" class="card-title">Integration</text>
  <text x="125" y="224" class="subtitle">Connected data source</text>

  <text x="640" y="190" class="card-title">Discovery</text>
  <text x="640" y="224" class="subtitle">Found and under review</text>

  <text x="1134" y="190" class="card-title">Inventory</text>
  <text x="1134" y="224" class="subtitle">Maintained Asset set</text>

  <path d="M 474 202 H 586" fill="none" stroke="#496589" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 968 202 H 1080" fill="none" stroke="#496589" stroke-width="3" marker-end="url(#arrow)"/>
  <circle cx="530" cy="202" r="5" fill="#243852"/>
  <circle cx="1024" cy="202" r="5" fill="#243852"/>

  <path d="M 1314 270 V 346" fill="none" stroke="#496589" stroke-width="3" stroke-dasharray="8 9" marker-end="url(#arrow)"/>
  <text x="1338" y="317" class="small">organize</text>

  <!-- Structure -->
  <g filter="url(#card-shadow)">
    <rect x="70" y="446" width="370" height="406" rx="20" fill="url(#card-gradient)" stroke="#34496d" stroke-width="2.5"/>
  </g>
  <text x="112" y="500" class="card-title">Structure</text>
  <text x="112" y="532" class="subtitle">A hierarchy you define</text>

  <path d="M 137 582 V 754" fill="none" stroke="#38506f" stroke-width="3"/>
  <path d="M 137 607 H 164 M 137 682 H 190 M 137 757 H 216" fill="none" stroke="#38506f" stroke-width="3"/>
  <circle cx="137" cy="582" r="7" fill="#21c9d8"/>
  <circle cx="137" cy="657" r="6" fill="#21c9d8"/>
  <circle cx="137" cy="732" r="6" fill="#21c9d8"/>

  <rect x="164" y="572" width="202" height="50" rx="14" fill="#0c5060" stroke="#167588"/>
  <text x="188" y="604" class="body">Company</text>
  <rect x="190" y="647" width="202" height="50" rx="14" fill="#0c5060" stroke="#167588"/>
  <text x="214" y="679" class="body">Organization</text>
  <rect x="216" y="722" width="150" height="50" rx="14" fill="#0c5060" stroke="#167588"/>
  <text x="240" y="754" class="body">Group</text>

  <text x="112" y="818" class="small">Example Structure nodes</text>

  <!-- Element container -->
  <rect x="530" y="356" width="1000" height="496" rx="22" fill="#0e141f" stroke="#34496d" stroke-width="3"/>
  <text x="576" y="416" class="card-title">Element</text>
  <text x="576" y="450" class="subtitle">An operational unit: Application, Service, or Site</text>

  <g>
    <rect x="1164" y="390" width="130" height="35" rx="17.5" fill="#101f35" stroke="#324968"/>
    <text x="1186" y="413" class="small">Application</text>
    <rect x="1304" y="390" width="96" height="35" rx="17.5" fill="#101f35" stroke="#324968"/>
    <text x="1325" y="413" class="small">Service</text>
    <rect x="1410" y="390" width="78" height="35" rx="17.5" fill="#101f35" stroke="#324968"/>
    <text x="1432" y="413" class="small">Site</text>
  </g>

  <!-- Structure Tag attachments -->
  <path d="M 440 592 H 512" fill="none" stroke="#24cad5" stroke-width="3" marker-end="url(#accent-arrow)"/>
  <rect x="444" y="548" width="124" height="30" rx="15" fill="#0b303d" stroke="#176577"/>
  <text x="458" y="568" class="accent">Structure Tag</text>

  <path d="M 440 742 C 486 742, 492 720, 572 720" fill="none" stroke="#24cad5" stroke-width="2.5" stroke-dasharray="7 8" marker-end="url(#accent-arrow)"/>
  <text x="454" y="705" class="small">to Collection</text>

  <!-- Collections -->
  <g filter="url(#card-shadow)">
    <rect x="576" y="486" width="440" height="286" rx="18" fill="url(#collection-gradient)" stroke="#334a6d" stroke-width="2.5"/>
    <rect x="1052" y="486" width="432" height="286" rx="18" fill="url(#collection-gradient)" stroke="#334a6d" stroke-width="2.5"/>
  </g>

  <text x="610" y="530" class="collection-title">Collection</text>
  <text x="610" y="560" class="subtitle">“Core network”</text>

  <g>
    <rect x="610" y="588" width="372" height="48" rx="12" fill="#17243a" stroke="#3b506f" stroke-width="2"/>
    <rect x="630" y="604" width="16" height="16" rx="4" fill="#28cce0"/>
    <text x="664" y="619" class="body">Router · core-rtr-01</text>

    <rect x="610" y="648" width="372" height="48" rx="12" fill="#17243a" stroke="#3b506f" stroke-width="2"/>
    <rect x="630" y="664" width="16" height="16" rx="4" fill="#28cce0"/>
    <text x="664" y="679" class="body">Firewall · edge-fw-02</text>

    <rect x="610" y="708" width="372" height="48" rx="12" fill="#17243a" stroke="#3b506f" stroke-width="2"/>
    <rect x="630" y="724" width="16" height="16" rx="4" fill="#28cce0"/>
    <text x="664" y="739" class="body">Switch · dist-sw-04</text>
  </g>

  <text x="1086" y="530" class="collection-title">Collection</text>
  <text x="1086" y="560" class="subtitle">“App tier”</text>

  <g>
    <rect x="1086" y="588" width="364" height="48" rx="12" fill="#17243a" stroke="#3b506f" stroke-width="2"/>
    <rect x="1106" y="604" width="16" height="16" rx="4" fill="#28cce0"/>
    <text x="1140" y="619" class="body">Server · web-01</text>

    <rect x="1086" y="648" width="364" height="48" rx="12" fill="#17243a" stroke="#3b506f" stroke-width="2"/>
    <rect x="1106" y="664" width="16" height="16" rx="4" fill="#28cce0"/>
    <text x="1140" y="679" class="body">Database · orders-db</text>
  </g>

  <circle cx="1107" cy="733" r="5" fill="#21c9d8"/>
  <text x="1124" y="739" class="small">Collections group existing Assets.</text>

  <rect x="576" y="797" width="908" height="34" rx="17" fill="#0b303d" stroke="#18586a"/>
  <circle cx="598" cy="814" r="5" fill="#64e3de"/>
  <text x="616" y="820" class="accent">Open an Asset's Relationship Graph to inspect supported connections.</text>

  <!-- Notes -->
  <line x1="70" y1="902" x2="1530" y2="902" stroke="#222f43" stroke-width="2"/>
  <circle cx="79" cy="936" r="4" fill="#21c9d8"/>
  <text x="96" y="942" class="small">Assets can also arrive from a bulk import instead of an Integration.</text>
  <circle cx="79" cy="969" r="4" fill="#21c9d8"/>
  <text x="96" y="975" class="small">Structure Tags can attach to Elements, Collections, and other supported records. Names shown are documentation-only demo data.</text>
</svg>
